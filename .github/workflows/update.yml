name: עדכון נתונים ופרסום

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:          # "Run workflow" button for a manual update
  push:
    branches: [main]
    # changes to the new app, docs or tooling never redeploy the legacy site
    paths-ignore: ['apps/**', 'docs/**', '.claude/**', 'CLAUDE.md', '.github/workflows/web-ci.yml']

# Least privilege per job (security review 2026-10-15): only the data job writes to the repo, only deploy writes Pages.
permissions:
  contents: read

concurrency:
  group: hayatzia-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: run
        name: Pull from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: ${{ vars.SEASON || '2024' }}
        run: node scripts/update.mjs
      - name: Save data if it changed
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "hayatzia-bot"
          git config user.email "hayatzia-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "עדכון נתוני ליגה"
          git push

  # New app: copy the fresh data into Supabase (staging + production).
  ingest:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/web-ingest.yml
    secrets: inherit

  deploy:
    needs: update
    if: always() && (github.event_name == 'push' || needs.update.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -d data ] && cp -r data _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
