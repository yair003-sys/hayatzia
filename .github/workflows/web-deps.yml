name: web deps (add or update packages)

# The Claude sandbox cannot reach npm. Run this workflow to add/update packages:
#   gh api -X POST repos/yair003-sys/hayatzia/actions/workflows/web-deps.yml/dispatches \
#     -f ref=main -f inputs[packages]="drizzle-orm@latest postgres@latest" -f inputs[dev]=false
# It installs with exact versions and commits package.json + package-lock.json to main.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'space-separated package specs, e.g. "zod@latest @supabase/ssr@latest"'
        required: true
      dev:
        description: 'install as devDependencies'
        type: boolean
        default: false
      remove:
        description: 'uninstall instead of install'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to start web-ci after committing the lockfile

jobs:
  deps:
    # It commits to main, so it only runs from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Inputs reach the shell only as environment variables, and only plain package names pass (security review
      # 2026-10-15: no shell injection through the package list).
      - name: Change dependencies
        env:
          PKGS: ${{ inputs.packages }}
          REMOVE: ${{ inputs.remove }}
          DEV: ${{ inputs.dev }}
        run: |
          if ! printf '%s' "$PKGS" | grep -Eq '^(@?[a-z0-9][a-z0-9._/-]*(@[A-Za-z0-9._^~<>=-]+)?)( @?[a-z0-9][a-z0-9._/-]*(@[A-Za-z0-9._^~<>=-]+)?)*$'; then
            echo "::error::packages must be plain npm package names (name or name@version)"; exit 1
          fi
          read -ra arr <<<"$PKGS"
          npm ci
          if [ "$REMOVE" = "true" ]; then
            npm uninstall -- "${arr[@]}"
          elif [ "$DEV" = "true" ]; then
            npm install --save-exact --save-dev --ignore-scripts -- "${arr[@]}"
          else
            npm install --save-exact --ignore-scripts -- "${arr[@]}"
          fi
      - name: Commit
        env:
          PKGS: ${{ inputs.packages }}
          VERB: ${{ inputs.remove && 'remove' || 'add' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "web deps: $VERB $PKGS"
          git pull --rebase "$REPO_URL" main
          git push "$REPO_URL" HEAD:main
      - name: Trigger CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web-ci.yml --ref main
