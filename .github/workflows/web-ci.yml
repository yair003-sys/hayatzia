name: web CI (Next.js)

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/web-ci.yml']
  workflow_dispatch:

permissions:
  contents: write   # the bootstrap step commits the resolved lockfile

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_ENV: local   # CI never talks to preview or production services
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Claude sandbox cannot reach npm, so dependency resolution happens here once
      # and the exact versions + lockfile are committed back to main.
      - name: Bootstrap dependencies (only when no lockfile yet)
        id: boot
        run: |
          if [ ! -f package-lock.json ]; then
            ./scripts/bootstrap-deps.sh
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit resolved lockfile
        if: steps.boot.outputs.created == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "web: נעילת גרסאות תלויות (נוצר אוטומטית ב-CI)"
          git pull --rebase origin main
          git push

      - name: Install
        if: steps.boot.outputs.created != 'true'
        run: ./scripts/ci-step.sh install npm ci

      - name: Typecheck
        run: ./scripts/ci-step.sh typecheck bash -c 'npx next typegen && npm run typecheck'

      - name: Lint
        run: ./scripts/ci-step.sh lint npm run lint

      - name: Unit tests
        run: ./scripts/ci-step.sh unit-tests npm test

      - name: Build
        run: ./scripts/ci-step.sh build npm run build

      - name: E2E smoke (local build only)
        run: |
          npx playwright install --with-deps chromium
          ./scripts/ci-step.sh e2e npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
