<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="onefan">
  <!-- onefan app mark on a graphite tile (redesign 2026-11-05): neutral brand, rising-terraces mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c21"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#tile)"/>
  <rect width="99" height="99" x=".5" y=".5" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g transform="translate(19 17) scale(1.6)">
    <rect x="2" y="24" width="7" height="14" rx="2" fill="#f5f6f8" opacity=".5"/>
    <rect x="11" y="18" width="7" height="20" rx="2" fill="#f5f6f8" opacity=".78"/>
    <rect x="20" y="12" width="7" height="26" rx="2" fill="#f5f6f8"/>
    <rect x="30" y="3" width="7" height="35" rx="2" fill="#f5f6f8"/>
    <rect x="26" y="3" width="4" height="4" rx="1" fill="#f5f6f8"/>
  </g>
</svg>
