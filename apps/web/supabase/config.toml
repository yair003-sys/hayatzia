# Local Supabase (CLI) used by CI to apply every migration from scratch and run the database tests.
# Never linked to the real projects: deploying migrations stays staging first, then production (docs/ENVIRONMENTS.md).
project_id = "hayatzia-local"

[db]
major_version = 17

[api]
# The schemas PostgREST exposes (the CLI's default). NEVER add `private`: its security-definer helpers are callable by
# signed-in fans so that row rules and triggers can use them (see migrations/20261017093000_perf_review.sql). The same
# rule holds in the hosted projects (dashboard → API → exposed schemas).
schemas = ["public", "graphql_public"]
